name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check watermeter/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # CPU-only torch first, same as the Dockerfile
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-docker.txt -r requirements-dev.txt
          # openvino comes from the base image in Docker; install it explicitly here
          pip install "openvino>=2025.0.0,<2026.0.0"
          pip install pytest-cov

      - name: Run unit tests
        run: pytest tests/unit/ -x -q
