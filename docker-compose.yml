services:
  watermeter:
    build: .
    image: watermeter-dashboard:latest
    container_name: watermeter-dashboard

    ports:
      - "8001:8001"

    volumes:
      # Configuration (will be auto-populated with defaults if empty)
      - ./config:/config
      # Data persistence (state.json)
      - ./data:/data
      # Trained models (will be auto-populated with defaults if empty)
      - ./models:/app/models
      # Training data: input images and ground truth
      - ./training:/training
      # Model download cache (timm/huggingface pretrained weights)
      - /home/thomas/.cache/huggingface:/app/.cache/huggingface

    devices:
      # Intel GPU for OpenVINO acceleration
      - /dev/dri/renderD128:/dev/dri/renderD128

    group_add:
      # Grant access to GPU device
      - "${RENDER_GROUP:-44}"

    environment:
      # Optional: Override logging level
      - LOG_LEVEL=INFO
      # Optional: HuggingFace API token (avoids download rate limits)
      # Get yours at https://huggingface.co/settings/tokens
      - HF_TOKEN=${HF_TOKEN:-}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python3", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

