<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore & Tune - AI Water Meter</title>
    <link rel="stylesheet" href="/static/style.css">
    {% include '_theme.html' %}
    <style>
        /* --- Layout --- */
        .explore-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .back-link {
            color: var(--primary, #2563eb);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover { text-decoration: underline; }

        .explore-type-select {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explore-type-select select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-input, #cbd5e1);
            background: var(--bg-input, #fff);
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .explore-layout {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 20px;
            min-height: 500px;
        }

        /* --- Class Sidebar --- */
        .class-sidebar {
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 8px;
            overflow-y: auto;
            max-height: 600px;
        }

        .class-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border, #e2e8f0);
            font-size: 0.9rem;
            transition: background 0.1s;
        }

        .class-item:last-child { border-bottom: none; }
        .class-item:hover { background: var(--bg-alt, #f1f5f9); }

        .class-item.active {
            background: var(--info-bg, #dbeafe);
            font-weight: 600;
            border-left: 3px solid var(--primary, #2563eb);
        }

        .class-item .class-count {
            color: var(--text-light);
            font-size: 0.8rem;
        }

        /* --- Image Grid --- */
        .image-panel {
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 8px;
            padding: 16px;
        }

        .image-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .image-panel-header h3 { margin: 0; font-size: 1rem; }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }

        .image-grid img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            border-radius: 4px;
            background: var(--bg-inset, #f1f5f9);
            border: 1px solid var(--border, #e2e8f0);
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .image-grid img:hover {
            border-color: var(--primary, #2563eb);
        }

        /* --- Image Selection --- */
        .image-grid .img-wrapper {
            position: relative;
            cursor: pointer;
        }

        .image-grid .img-wrapper img {
            cursor: pointer;
        }

        .image-grid .img-wrapper.selected img {
            border-color: var(--primary, #2563eb);
            border-width: 2px;
        }

        .image-grid .img-wrapper.selected::after {
            content: '\2713';
            position: absolute;
            top: 2px;
            right: 4px;
            background: var(--primary, #2563eb);
            color: #fff;
            font-size: 0.7rem;
            width: 16px;
            height: 16px;
            line-height: 16px;
            text-align: center;
            border-radius: 50%;
            pointer-events: none;
        }

        /* --- Bulk Action Bar --- */
        .bulk-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .bulk-actions a {
            color: var(--primary, #2563eb);
            cursor: pointer;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .bulk-actions a:hover { text-decoration: underline; }

        .btn-bulk-move {
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--border-input, #cbd5e1);
            background: var(--bg-alt, #f1f5f9);
            color: var(--text-dark);
            cursor: pointer;
        }

        .btn-bulk-move:hover { background: var(--bg-surface, #fff); }
        .btn-bulk-move:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-bulk-delete {
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--danger, #dc2626);
            background: var(--danger-bg, #fee2e2);
            color: var(--danger, #dc2626);
            cursor: pointer;
        }

        .btn-bulk-delete:hover { background: var(--danger, #dc2626); color: #fff; }
        .btn-bulk-delete:disabled { opacity: 0.5; cursor: not-allowed; }

        .load-more-row {
            text-align: center;
            margin-bottom: 16px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-light);
            padding: 40px;
        }

        /* --- Tools Bar --- */
        .tools-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            margin-top: 20px;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 8px;
            background: var(--bg-surface, #fff);
        }

        .tools-bar .tools-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* --- Tool Results (mislabel/prune) --- */
        .tool-results {
            margin-top: 16px;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 8px;
            padding: 16px;
        }

        .tool-status {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .tool-status.scanning { background: var(--info-bg, #dbeafe); }
        .tool-status.complete { background: var(--success-bg, #d1fae5); }
        .tool-status.error { background: var(--danger-bg, #fee2e2); }

        /* Reuse mislabel card styles */
        .mislabel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .mislabel-card {
            border: 2px solid var(--border, #e2e8f0);
            border-radius: 8px;
            padding: 6px;
            cursor: pointer;
            text-align: center;
            transition: border-color 0.15s, background 0.15s;
        }

        .mislabel-card:hover { border-color: var(--primary, #2563eb); }
        .mislabel-card.selected { border-color: var(--primary, #2563eb); background: var(--info-bg, #dbeafe); }
        .mislabel-card img { width: 100%; height: 90px; object-fit: contain; border-radius: 4px; background: var(--bg-inset, #f1f5f9); margin-bottom: 4px; }
        .mislabel-card .mislabel-labels { font-size: 0.75rem; line-height: 1.3; }
        .mislabel-card .label-current { color: var(--danger, #dc2626); text-decoration: line-through; }
        .mislabel-card .label-predicted { color: var(--success, #059669); font-weight: 600; }

        /* Prune results */
        .prune-class-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 6px;
            margin-bottom: 12px;
            max-height: 250px;
            overflow-y: auto;
        }

        .prune-class-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 10px;
            border-radius: 4px;
            background: var(--bg-surface, #fff);
            border: 1px solid var(--border, #e2e8f0);
            font-size: 0.8rem;
        }

        .prune-removable { color: var(--danger, #dc2626); font-weight: 600; }

        .tool-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--border-input, #cbd5e1);
            background: var(--bg-surface, #fff);
            color: var(--text-dark);
            cursor: pointer;
        }

        .btn-sm:hover { background: var(--bg-alt, #f1f5f9); }

        /* Toast message */
        .message {
            display: none;
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            z-index: 1000;
            animation: slideIn 0.2s ease;
        }

        .message.success { display: block; background: var(--success-bg, #d1fae5); color: var(--success, #059669); border: 1px solid var(--success); }
        .message.error { display: block; background: var(--danger-bg, #fee2e2); color: var(--danger, #dc2626); border: 1px solid var(--danger); }

        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        @media (max-width: 768px) {
            .explore-layout { grid-template-columns: 1fr; }
            .class-sidebar { max-height: 200px; }
        }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <div class="container">
        <div id="message" class="message"></div>

        <div class="explore-header">
            <a href="/training" class="back-link">&larr; Back to Training</a>
            <h1>Explore &amp; Tune</h1>
            <div class="explore-type-select">
                <label for="explore-type">Type:</label>
                <select id="explore-type" onchange="onTypeChange()">
                    <option value="digits">Digits</option>
                    <option value="arrows">Arrows</option>
                </select>
            </div>
        </div>

        <div class="explore-layout">
            <div class="class-sidebar" id="class-sidebar">
                <div class="empty-state">Loading...</div>
            </div>

            <div class="image-panel" id="image-panel">
                <div class="image-panel-header">
                    <h3 id="image-panel-title">Select a class</h3>
                    <div class="bulk-actions" id="bulk-actions" style="display:none">
                        <a href="javascript:void(0)" onclick="bulkSelectAll()">Select All</a>
                        <a href="javascript:void(0)" onclick="bulkDeselectAll()">Deselect All</a>
                        <button class="btn-bulk-move" id="btn-bulk-move" disabled onclick="bulkMoveToInput()">Send to Labeling</button>
                        <button class="btn-bulk-delete" id="btn-bulk-delete" disabled onclick="bulkDelete()">Delete</button>
                    </div>
                    <span id="image-panel-page" style="font-size:0.85rem;color:var(--text-light)"></span>
                </div>
                <div id="image-grid" class="image-grid"></div>
                <div id="load-more-row" class="load-more-row" style="display:none">
                    <button class="btn btn-sm" onclick="loadMoreImages()">Load More</button>
                </div>
                <div id="image-empty" class="empty-state">Click a class to browse its images.</div>
            </div>
        </div>

        <!-- Tools Bar -->
        <div class="tools-bar">
            <span class="tools-label">Tools:</span>
            <button class="btn btn-primary" id="mislabel-scan-btn" onclick="startMislabelScan()">Scan for Mislabels</button>
            <button class="btn btn-primary" id="prune-preview-btn" onclick="startPrunePreview()">Preview Pruning</button>
        </div>

        <!-- Mislabel Results -->
        <div id="mislabel-results-section" class="tool-results" style="display:none">
            <div id="mislabel-status" class="tool-status"></div>
            <div id="mislabel-results" style="display:none">
                <div class="tool-actions">
                    <span id="mislabel-count"></span>
                    <div>
                        <button class="btn btn-sm" onclick="toggleAllMislabels(true)">Select All</button>
                        <button class="btn btn-sm" onclick="toggleAllMislabels(false)">Deselect All</button>
                    </div>
                </div>
                <div id="mislabel-grid" class="mislabel-grid"></div>
                <div class="tool-actions">
                    <div></div>
                    <button class="btn btn-primary" id="mislabel-confirm-btn" onclick="confirmMislabels()">Move Selected to Input Queue</button>
                </div>
            </div>
        </div>

        <!-- Prune Results -->
        <div id="prune-results-section" class="tool-results" style="display:none">
            <div id="prune-status" class="tool-status"></div>
            <div id="prune-results" style="display:none">
                <div id="prune-summary" style="font-weight:600;margin-bottom:8px"></div>
                <div id="prune-class-list" class="prune-class-list"></div>
                <div class="tool-actions">
                    <div></div>
                    <button class="btn btn-primary" id="prune-confirm-btn" onclick="confirmPrune()">Confirm &amp; Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/explore.js?v=2"></script>
</body>
</html>
