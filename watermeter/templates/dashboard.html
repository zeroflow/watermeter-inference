<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Water Meter Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    {% include '_theme.html' %}
</head>
<body>
    {% include '_nav.html' %}
    <div class="container">
        <header>
            <h1>🌊 AI Water Meter Dashboard</h1>
            <div class="header-actions">
                {% if models_loaded %}
                <button
                    hx-post="/api/trigger"
                    hx-target="#status-message"
                    hx-swap="innerHTML"
                    class="btn btn-primary">
                    🔄 Read Now
                </button>
                {% else %}
                <button class="btn btn-primary" disabled title="No models loaded -- train or import a model first">
                    🔄 Read Now
                </button>
                {% endif %}
                <div class="meter-input-group">
                    <input type="number" id="meter-value-input"
                           step="0.0001" min="0" placeholder="e.g. 34.8961"
                           class="meter-value-input">
                    <button class="btn btn-primary btn-small" onclick="setMeterValue()">
                        Set
                    </button>
                    <button class="btn btn-secondary btn-small"
                            onclick="if(confirm('Reset previous value to unknown? The next reading will be accepted without plausibility check.')) { fetch('/api/reset', {method:'POST'}).then(r=>r.json()).then(d=>{showStatusMessage(d.message || 'Reset complete'); }); }">
                        Reset
                    </button>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="auto-refresh" checked onchange="toggleAutoRefresh(this)">
                    <span>Auto-Refresh</span>
                </label>
                <label class="toggle">
                    <input type="checkbox" id="ha-publish" checked onchange="toggleHaPublish(this)">
                    <span>HA Publish</span>
                </label>
            </div>
        </header>

        <div id="status-message" class="status-message"></div>

        <main hx-get="/api/status/html" hx-trigger="load, every 5s" hx-swap="innerHTML">
            <!-- Status will be loaded dynamically here -->
            <div class="loading">
                <p>Loading status...</p>
            </div>
        </main>
    </div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
