<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Water Meter Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    {% include '_nav.html' %}
    <div class="container">
        <header>
            <h1>🌊 AI Water Meter Dashboard</h1>
            <div class="header-actions">
                <button
                    hx-post="/api/trigger"
                    hx-target="#status-message"
                    hx-swap="innerHTML"
                    class="btn btn-primary">
                    🔄 Jetzt Auslesen
                </button>
                <button
                    hx-post="/api/reset"
                    hx-target="#status-message"
                    hx-swap="innerHTML"
                    class="btn btn-secondary"
                    onclick="return confirm('Previous Value zurücksetzen?')">
                    ↺ Reset
                </button>
                <label class="toggle">
                    <input type="checkbox" id="auto-refresh" checked onchange="toggleAutoRefresh(this)">
                    <span>Auto-Refresh</span>
                </label>
                <label class="toggle">
                    <input type="checkbox" id="ha-publish" checked onchange="toggleHaPublish(this)">
                    <span>HA Publish</span>
                </label>
            </div>
        </header>

        <div id="status-message" class="status-message"></div>

        <main hx-get="/api/status/html" hx-trigger="load, every 5s" hx-swap="innerHTML">
            <!-- Status wird hier dynamisch geladen -->
            <div class="loading">
                <p>Lade Status...</p>
            </div>
        </main>
    </div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
